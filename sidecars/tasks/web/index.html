<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beads Tasks</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css?v=8" />
</head>
<body>
  <script>
    try {
      const key = (window.__tasksUiConfig?.storageKey || 'beads-tasks-review-queue') + ':theme';
      let raw;
      try { raw = sessionStorage.getItem(key); } catch {}
      if (raw == null) { try { raw = localStorage.getItem(key); } catch {} }
      const theme = JSON.parse(raw);
      if (theme?.cssVariables && typeof theme.cssVariables === 'object') {
        for (const [k, v] of Object.entries(theme.cssVariables)) document.documentElement.style.setProperty(k, v);
      }
      if (theme?.dataTheme) document.documentElement.dataset.theme = theme.dataTheme;
    } catch { /* storage may be unavailable */ }
  </script>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-row">
        <div class="topbar-title-wrap">
          <h1 id="view-title" class="topbar-title">Beads Tasks</h1>
          <span id="project-badge" class="badge project-chip hidden"></span>
        </div>
        <div class="topbar-actions">
          <select id="project-select" class="select" aria-label="Select project"></select>
          <button id="btn-find" class="btn btn-ghost btn-icon-only" type="button" title="Find in page (⌘F / Ctrl+F)" aria-label="Find in page" aria-pressed="false">
            <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5"></circle>
              <path d="M10.5 10.5L14 14"></path>
            </svg>
          </button>
          <button id="btn-home" class="btn btn-ghost" type="button" title="Project task overview">
            <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2.5" width="5" height="5" rx="1"></rect>
              <rect x="9" y="2.5" width="5" height="5" rx="1"></rect>
              <rect x="2" y="9.5" width="5" height="4" rx="1"></rect>
              <rect x="9" y="9.5" width="5" height="4" rx="1"></rect>
            </svg>
            <span class="btn-label">Overview</span>
          </button>
          <button id="btn-refresh" class="btn btn-ghost" type="button" title="Refresh">
            <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.6"></path>
              <path d="M13.5 2.5v2.75h-2.75"></path>
            </svg>
            <span class="btn-label">Refresh</span>
          </button>
          <button id="btn-settings" class="btn btn-ghost btn-icon-only" type="button" title="Settings" aria-label="Settings" aria-pressed="false">
            <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.3"></circle><path d="M8 1.2v1.4M8 13.4v1.4M1.2 8h1.4M13.4 8h1.4M3.2 3.2l1 1M11.8 11.8l1 1M12.8 3.2l-1 1M4.2 11.8l-1 1"></path><circle cx="8" cy="8" r="5.2"></circle></svg>
          </button>
        </div>
      </div>
      <div id="find-bar" class="find-bar hidden" role="search" aria-label="Find in page">
        <div class="search-box find-input-wrap">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5"></circle>
            <path d="M10.5 10.5L14 14"></path>
          </svg>
          <input id="find-input" class="search-input" type="search" placeholder="Find in page…" autocomplete="off" spellcheck="false" aria-label="Find in page" />
          <button id="btn-find-clear" class="search-clear hidden" type="button" title="Clear search" aria-label="Clear search">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8"></path>
            </svg>
          </button>
        </div>
        <span id="find-count" class="find-count mono" aria-live="polite"></span>
        <div class="find-actions">
          <button id="btn-find-filter" class="btn btn-ghost btn-xs hidden" type="button" title="Only show matching task cards" aria-pressed="false">Matches only</button>
          <button id="btn-find-prev" class="btn btn-ghost btn-icon-only btn-find-nav" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>
            <svg class="btn-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 10l4-4 4 4"></path>
            </svg>
          </button>
          <button id="btn-find-next" class="btn btn-ghost btn-icon-only btn-find-nav" type="button" title="Next match (Enter)" aria-label="Next match" disabled>
            <svg class="btn-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6l4 4 4-4"></path>
            </svg>
          </button>
          <button id="btn-find-close" class="btn btn-ghost btn-icon-only btn-find-nav" type="button" title="Close find (Esc)" aria-label="Close find">
            <svg class="btn-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8"></path>
            </svg>
          </button>
        </div>
      </div>
      <div id="batch-nav" class="batch-nav hidden"></div>
    </header>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <main id="app-root" class="main">
      <div class="empty-state">Loading…</div>
    </main>
    <script>
      try {
        const params = new URLSearchParams(window.__rscInitialSearch ?? location.search);
        const copy = (params.get('clip') || params.get('copy') || params.get('©') || '').trim();
        if (/^[a-z0-9][a-z0-9._-]{1,63}$/i.test(copy) && copy.toLowerCase() !== 'true' && !(params.get('id') || '').trim() && !(params.get('ids') || '').trim()) {
          const root = document.getElementById('app-root');
          root.innerHTML = '';
          const conversationId = (window.sidecar && window.sidecar.conversationId) || params.get('conversationId') || '';
          const prefix = (window.__tasksUiConfig?.storageKey || 'beads-tasks-review-queue') + ':';
          const read = (suffix) => {
            const key = prefix + suffix + ':' + (conversationId || '_default');
            let value;
            try { value = sessionStorage.getItem(key); } catch {}
            if (value == null) { try { value = localStorage.getItem(key); } catch {} }
            return JSON.parse(value);
          };
          const paint = read('view-paint');
          if (paint && String(paint.conversationId || '') === String(conversationId || '')) {
            const title = document.getElementById('view-title');
            const badge = document.getElementById('project-badge');
            const nav = document.getElementById('batch-nav');
            title.textContent = paint.title;
            badge.textContent = paint.projectBadgeText;
            badge.classList.toggle('hidden', paint.projectBadgeHidden);
            badge.style.setProperty('--project-color', paint.projectBadgeColor);
            nav.innerHTML = paint.batchNavHtml;
            nav.classList.toggle('hidden', paint.batchNavHidden);
            root.innerHTML = paint.appRootHtml;
            document.getElementById('btn-settings').setAttribute('aria-pressed', paint.settingsPressed);
            try { root.scrollTop = read('scroll')?.rootScrollTop || 0; } catch {}
          }
        }
      } catch { /* storage may be unavailable */ }
    </script>
  </div>

  <script src="/notes_format.js?v=8"></script>
  <script src="/in_page_search.js?v=8"></script>
  <script src="/review_queue.js?v=8"></script>
  <script src="/i18n.js?v=9"></script>
  <script src="/app.js?v=8"></script>
</body>
</html>
