<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beads Tasks</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css?v=8" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-row">
        <div class="topbar-title-wrap">
          <h1 id="view-title" class="topbar-title">Beads Tasks</h1>
          <span id="project-badge" class="badge project-chip hidden"></span>
        </div>
        <div class="topbar-actions">
          <select id="project-select" class="select" aria-label="选择项目"></select>
          <button id="btn-find" class="btn btn-ghost btn-icon-only" type="button" title="页内搜索 (⌘F / Ctrl+F)" aria-label="页内搜索" aria-pressed="false">
            <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5"></circle>
              <path d="M10.5 10.5L14 14"></path>
            </svg>
          </button>
          <button id="btn-home" class="btn btn-ghost" type="button" title="项目任务总览">
            <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2.5" width="5" height="5" rx="1"></rect>
              <rect x="9" y="2.5" width="5" height="5" rx="1"></rect>
              <rect x="2" y="9.5" width="5" height="4" rx="1"></rect>
              <rect x="9" y="9.5" width="5" height="4" rx="1"></rect>
            </svg>
            <span class="btn-label">总览</span>
          </button>
          <button id="btn-refresh" class="btn btn-ghost" type="button" title="刷新">
            <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.6"></path>
              <path d="M13.5 2.5v2.75h-2.75"></path>
            </svg>
            <span class="btn-label">刷新</span>
          </button>
          <button id="btn-settings" class="btn btn-ghost btn-icon-only" type="button" title="设置" aria-label="设置" aria-pressed="false">
            <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.3"></circle><path d="M8 1.2v1.4M8 13.4v1.4M1.2 8h1.4M13.4 8h1.4M3.2 3.2l1 1M11.8 11.8l1 1M12.8 3.2l-1 1M4.2 11.8l-1 1"></path><circle cx="8" cy="8" r="5.2"></circle></svg>
          </button>
        </div>
      </div>
      <div id="find-bar" class="find-bar hidden" role="search" aria-label="页内搜索">
        <div class="search-box find-input-wrap">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5"></circle>
            <path d="M10.5 10.5L14 14"></path>
          </svg>
          <input id="find-input" class="search-input" type="search" placeholder="页内搜索…" autocomplete="off" spellcheck="false" aria-label="页内搜索关键词" />
          <button id="btn-find-clear" class="search-clear hidden" type="button" title="清空关键词" aria-label="清空关键词">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8"></path>
            </svg>
          </button>
        </div>
        <span id="find-count" class="find-count mono" aria-live="polite"></span>
        <div class="find-actions">
          <button id="btn-find-filter" class="btn btn-ghost btn-xs hidden" type="button" title="仅显示包含匹配项的任务卡片" aria-pressed="false">仅匹配</button>
          <button id="btn-find-prev" class="btn btn-ghost btn-icon-only btn-find-nav" type="button" title="上一处 (Shift+Enter)" aria-label="上一处" disabled>
            <svg class="btn-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 10l4-4 4 4"></path>
            </svg>
          </button>
          <button id="btn-find-next" class="btn btn-ghost btn-icon-only btn-find-nav" type="button" title="下一处 (Enter)" aria-label="下一处" disabled>
            <svg class="btn-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6l4 4 4-4"></path>
            </svg>
          </button>
          <button id="btn-find-close" class="btn btn-ghost btn-icon-only btn-find-nav" type="button" title="关闭页内搜索 (Esc)" aria-label="关闭页内搜索">
            <svg class="btn-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8"></path>
            </svg>
          </button>
        </div>
      </div>
      <div id="batch-nav" class="batch-nav hidden"></div>
    </header>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <main id="app-root" class="main">
      <div class="empty-state">加载中…</div>
    </main>
  </div>

  <script src="/notes_format.js?v=8"></script>
  <script src="/in_page_search.js?v=8"></script>
  <script src="/review_queue.js?v=8"></script>
  <script src="/app.js?v=8"></script>
</body>
</html>
